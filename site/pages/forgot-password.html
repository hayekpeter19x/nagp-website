<!--meta { "title": "Forgot your password?", "description": "Get an email with a link to choose a new password.", "scripts": ["forgot-password.js"], "noindex": true } -->
<section class="page-header">
  <div class="container container-narrow">
    <h1>Forgot your password?</h1>
    <p class="lede">Type the email address you use for NAGP. We will email you a link to choose a new password.</p>
  </div>
</section>

<section class="section">
  <div class="container container-narrow">
    <div class="card">
      <form id="forgot-form" class="form" novalidate>
        <div class="field">
          <label for="forgot-email">Email address</label>
          <input id="forgot-email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="form-actions">
          <button class="btn btn-large" type="submit">Email me a link</button>
        </div>
        <div class="form-status" role="status" aria-live="polite"></div>
      </form>
      <p class="mt-1"><a href="/signin">Back to sign in</a></p>
      <p class="hint" id="forgot-demo" hidden>Preview: the website does not send emails yet. To try this page, use the demo address <strong>demo.member@nagp-preview.org</strong>.</p>
    </div>
  </div>
</section>
