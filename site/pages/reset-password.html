<!--meta { "title": "Choose a new password", "description": "Choose a new password for your NAGP account.", "scripts": ["reset-password.js"], "noindex": true } -->
<section class="page-header">
  <div class="container container-narrow">
    <h1>Choose a new password</h1>
  </div>
</section>

<section class="section">
  <div class="container container-narrow">
    <div id="reset-expired" hidden></div>
    <div class="card" id="reset-card">
      <form id="reset-form" class="form" novalidate>
        <p class="hint">Use at least 8 characters. A short sentence you will remember works well.</p>
        <div class="field">
          <label for="reset-password">New password</label>
          <input id="reset-password" name="password" type="password" autocomplete="new-password" required minlength="8">
        </div>
        <div class="field">
          <label for="reset-password2">Type the same password again</label>
          <input id="reset-password2" name="password_confirm" type="password" autocomplete="new-password" required>
          <label class="check mt-1"><input type="checkbox" id="reset-show"> Show my password</label>
        </div>
        <input type="hidden" name="token">
        <div class="form-actions">
          <button class="btn btn-large" type="submit">Save my new password</button>
        </div>
        <div class="form-status" role="status" aria-live="polite"></div>
      </form>
    </div>
  </div>
</section>
