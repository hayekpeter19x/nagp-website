<!--meta { "title": "Members Directory", "description": "The members-only directory of NAGP members, by state.", "section": "members", "access": "member", "scripts": ["members-listing.js", "members-directory.js"], "styles": ["members.css"] } -->
<section class="section section-first">
  <div class="container">
    <h1 class="visually-hidden">Members Directory</h1>
    <form id="md-filters" class="filters" role="search" aria-label="Search the member directory">
      <div class="field">
        <label for="md-state">State or province</label>
        <select id="md-state" name="state"></select>
      </div>
      <div class="field">
        <label for="md-type">Type of member</label>
        <select id="md-type" name="type">
          <option value="">All members</option>
          <option value="professional">Practicing professionals</option>
          <option value="student">Students and trainees</option>
          <option value="associate">Other members</option>
        </select>
      </div>
      <div class="field">
        <label for="md-q">Name or keyword <span class="optional">(optional)</span></label>
        <input id="md-q" name="q" type="search" maxlength="100" autocomplete="off" placeholder="For example: a name or a city">
      </div>
      <div class="filter-buttons">
        <button class="btn" type="submit">Search</button>
        <button class="btn btn-secondary" type="button" id="md-clear">Clear search</button>
      </div>
    </form>

    <p class="results-count" id="md-count" role="status" aria-live="polite"></p>
    <div id="md-results"><p class="loading">Loading the directory…</p></div>
  </div>
</section>
